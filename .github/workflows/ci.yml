name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Assemble app bundle (release)
        run: ./scripts/build.sh

      - name: Sanity-check the bundle
        run: |
          test -x "build/Pookify Copilot.app/Contents/MacOS/PookifyCopilot"
          test -x "build/Pookify Copilot.app/Contents/MacOS/island-hook"
          plutil -lint "build/Pookify Copilot.app/Contents/Info.plist"
          # the notices must ship inside the bundle (license requirement)
          test -f "build/Pookify Copilot.app/Contents/Resources/THIRD_PARTY_NOTICES.md"

      - name: Smoke-test hooks
        run: ./scripts/test.sh

  scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh
